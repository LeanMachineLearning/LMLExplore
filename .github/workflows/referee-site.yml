name: Referee site

# The referee site of LMLExplore, served by GitHub Pages at https://leanmachinelearning.org/LMLExplore/,
# built with the LeanTrustBuilders suite as LML builds its own:
#   check    decides whether main's commit needs its dataset extracted: not when an earlier run
#            published it already;
#   extract  builds main, extracts its dataset (S2) with trust-extract, and checks the Literature
#            Links annotations of the citations in its docstrings and in the roadmaps of
#            LeanMachineLearning/LMLRoadmaps (scripts/literature/);
#   site     publishes the new dataset as the release dataset-<commit12> (or takes the one
#            published already), records the build in the provenance ledger (the branch
#            trust-ledger), and builds the site with referee-site, against the previous recorded
#            build and with the evidence store LeanMachineLearning/LMLExplore-evidence and the
#            stores it imports (LML's, Mathlib probability's), with the literature page beside it
#            (https://leanmachinelearning.org/LMLExplore/literature/);
#   deploy   deploys the site to GitHub Pages;
#   prune    deletes the dataset releases nobody needs any more.
#
# The split is the security boundary, as in ci.yml: Lean runs code at elaboration time, so the job
# that builds and imports LMLExplore holds only a read token, and the jobs that write (releases, the
# ledger branch, Pages) run no Lean, only Python tools that read the dataset and the sources as data.

# Twice a day (05:17 and 17:17 UTC) rather than on every push: main moves many times a day, and the
# site needs to be recent, not one build per commit. The site is rebuilt at every run, so that the
# reviews filed since the last one show even when main has not moved; only the expensive part,
# building and extracting, is skipped then. Forks run nothing: they have no Pages site, and a
# scheduled run there would publish a release and a ledger branch in the fork, then fail to deploy.
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      extract:
        description: Extract the dataset again even when this commit's is published already
        type: boolean
        default: false

permissions: {}

# One build at a time, so that ledger pushes never race when a manual run meets a scheduled one.
concurrency:
  group: referee-site
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'LeanMachineLearning/LMLExplore' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      extract: ${{ steps.check.outputs.extract }}
    steps:
      # The dataset release of main's commit exists when an earlier run built it.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.extract && 'true' || 'false' }}
        run: |
          if [ "$FORCE" != true ] && gh release view "dataset-${GITHUB_SHA:0:12}" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::main is still at ${GITHUB_SHA:0:12}, whose dataset is published: rebuilding the site only"
            echo "extract=false" >> "$GITHUB_OUTPUT"
          else
            echo "extract=true" >> "$GITHUB_OUTPUT"
          fi

  extract:
    needs: check
    if: needs.check.outputs.extract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      literature: ${{ steps.literature.outcome }}
      roadmaps: ${{ steps.literature.outputs.roadmaps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # This job builds and imports every LMLExplore module: no credentials in .git/config.
          persist-credentials: false

      # The same pinned elan as ci.yml.
      - name: Install elan (pinned + checksum) and the toolchain
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      # Mathlib's and Tau Ceti's prebuilt files, then LMLExplore. main is already checked by ci.yml.
      - name: Build
        run: bash scripts/build.sh

      # The newest trust-extract release for lean-toolchain. The upstream closure brings in the LML,
      # Tau Ceti and Mathlib declarations LMLExplore rests on: the site shows them, and the reviews
      # of them in the imported stores. The kernel checks that each declaration's dependency
      # closure is all it needs, proofs included.
      - name: Extract the dataset
        id: extract
        uses: LeanTrustBuilders/extractor/extract@23d25769a793e0af52c798b43c9369c8fd57fa3e
        with:
          root: LMLExplore
          repo: ${{ github.repository }}
          args: --upstream-closure term
          check: meaning term

      # The Literature Links annotations (https://github.com/mathlib-initiative/literature-links) of
      # the citations of numbered results in the docstrings and in the roadmaps, checked with the
      # format's own checker, pinned to v1.0.2. The site job writes them again from the dataset and
      # the same commit of LMLRoadmaps, with only the script of this repository; a failed check
      # leaves the literature page out without stopping the site.
      - name: Check the literature annotations
        id: literature
        continue-on-error: true
        env:
          DATASET: ${{ steps.extract.outputs.dataset }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/LeanMachineLearning/LMLRoadmaps "$RUNNER_TEMP/LMLRoadmaps"
          roadmaps=$(git -C "$RUNNER_TEMP/LMLRoadmaps" rev-parse HEAD)
          echo "roadmaps=$roadmaps" >> "$GITHUB_OUTPUT"
          python3 scripts/literature/annotations.py --dataset "$DATASET" \
            --bibliography scripts/literature/bibliography.json --out "$RUNNER_TEMP/literature" \
            --roadmaps "$RUNNER_TEMP/LMLRoadmaps" --roadmaps-commit "$roadmaps"
          python3 -m venv "$RUNNER_TEMP/literature-links"
          "$RUNNER_TEMP/literature-links/bin/pip" install --quiet \
            "git+https://github.com/mathlib-initiative/literature-links@e7eeafb823eb3bc64a8ab2077cd3569f572d459f"
          "$RUNNER_TEMP/literature-links/bin/literature-links" validate "$RUNNER_TEMP/literature/annotations.jsonl"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dataset
          path: ${{ steps.extract.outputs.dataset }}
          if-no-files-found: error
          retention-days: 1

  site:
    needs: [check, extract]
    # Also when extract was skipped: the site is then built from the dataset published already.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.extract.result == 'success' || needs.extract.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the dataset's release, and the ledger's branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The ledger dates builds with git, and referee-site reads the sources at this commit.
          fetch-depth: 0

      - if: needs.extract.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dataset
          path: ${{ runner.temp }}/dataset

      # What the extractor's action does when asked to publish, with the tag on this commit rather
      # than on whatever main is by now. Later builds take it as their baseline, and the evidence
      # store's intake keys records against it.
      - name: Publish the dataset as the release dataset-<commit12>
        if: needs.extract.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DATASET: ${{ runner.temp }}/dataset
          VERSION: ${{ needs.extract.outputs.version }}
        run: |
          set -euo pipefail
          tag="dataset-${GITHUB_SHA:0:12}"
          tar -czf "$RUNNER_TEMP/dataset.tar.gz" -C "$DATASET" .
          read -r spec commit library < <(python3 -c "import json,sys; m=json.load(open(sys.argv[1])); l=m['library']; print(m['spec'], l.get('commit',''), l.get('repo') or l.get('root',''))" "$DATASET/meta.json")
          [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::the dataset is of $commit, not $GITHUB_SHA"; exit 1; }
          notes="The dataset (S2, $spec) of $library at $commit, by $VERSION (LeanTrustBuilders/extractor)."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/dataset.tar.gz" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$RUNNER_TEMP/dataset.tar.gz" --target "$GITHUB_SHA" --latest=false \
              --title "LMLExplore $GITHUB_SHA" --notes "$notes"
          fi

      - name: Take the dataset published already for this commit
        if: needs.extract.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          DATASET: ${{ runner.temp }}/dataset
        run: |
          set -euo pipefail
          mkdir -p "$DATASET"
          gh release download "dataset-${GITHUB_SHA:0:12}" -R "$GITHUB_REPOSITORY" -p dataset.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/dataset.tar.gz" -C "$DATASET"
          commit=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['library'].get('commit',''))" "$DATASET/meta.json")
          [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::the dataset is of $commit, not $GITHUB_SHA"; exit 1; }

      # Pinned to v0.12.0, which pins the evidence-core and evidence-store releases it was tested with.
      - name: Build the referee site
        id: referee
        uses: LeanTrustBuilders/referee-site@3b745e5b418ceff84f30f2f9a64af0c4938effa7 # v0.12.0
        with:
          root: LMLExplore
          dataset: ${{ runner.temp }}/dataset
          # An editorial claim: the publisher vouches for Mathlib and everything under it. LML and
          # Tau Ceti are not under Mathlib, so the declarations of theirs that LMLExplore rests on
          # count as unaudited, unless reviews in the imported stores say otherwise.
          trust: mathlib
          evidence: LeanMachineLearning/LMLExplore-evidence

      # The literature page and its annotations, from the dataset and the roadmaps: the results of
      # the literature that the docstrings and the roadmaps cite, the declarations citing them, and
      # the results not linked yet. The roadmaps are read at the commit the extract job checked, or
      # at the newest one when it was skipped. Skipped when the extract job found the annotations
      # invalid. The run summary lists what scripts/literature/bibliography.json lacks.
      - name: Add the literature page
        if: needs.extract.outputs.literature != 'failure'
        env:
          DATASET: ${{ runner.temp }}/dataset
          SITE: ${{ steps.referee.outputs.site }}
          ROADMAPS: ${{ needs.extract.outputs.roadmaps }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/LMLRoadmaps"
          git -C "$RUNNER_TEMP/LMLRoadmaps" fetch -q --depth 1 \
            https://github.com/LeanMachineLearning/LMLRoadmaps "${ROADMAPS:-main}"
          git -C "$RUNNER_TEMP/LMLRoadmaps" checkout -q FETCH_HEAD
          python3 scripts/literature/annotations.py --dataset "$DATASET" \
            --bibliography scripts/literature/bibliography.json --out "$SITE/literature" \
            --roadmaps "$RUNNER_TEMP/LMLRoadmaps" \
            --roadmaps-commit "$(git -C "$RUNNER_TEMP/LMLRoadmaps" rev-parse HEAD)" \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.referee.outputs.site }}

  # The explicit conditions: by default a job is skipped when any job it rests on was, and extract
  # is skipped whenever main has not moved.
  deploy:
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The dataset releases kept: those of the last 30 days; the newest two, this build's and its
  # baseline (the previous build, which the next build compares against); and any whose commit an
  # open issue of the evidence store names, since intake keys a form's record in the dataset of the
  # commit the form names, and waits while it is missing. The site needs no other: the ledger keeps
  # the history its pages show. A deleted release takes its tag with it.
  prune:
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the dataset releases nobody needs any more
        env:
          GH_TOKEN: ${{ github.token }}
          STORE: LeanMachineLearning/LMLExplore-evidence
          KEEP_DAYS: '30'
        shell: python3 {0}
        run: |
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          repo = os.environ["GITHUB_REPOSITORY"]
          releases = json.loads(gh("release", "list", "-R", repo, "--limit", "1000", "--json", "tagName,createdAt"))
          datasets = sorted((r for r in releases if r["tagName"].startswith("dataset-")), key=lambda r: r["createdAt"])
          issues = json.loads(gh("issue", "list", "-R", os.environ["STORE"], "--state", "open", "--limit", "1000",
                                 "--json", "title,body"))
          named = "\n".join(f"{i['title']}\n{i['body']}" for i in issues)
          cutoff = datetime.now(timezone.utc) - timedelta(days=int(os.environ["KEEP_DAYS"]))
          deleted = 0
          for r in datasets[:-2]:
              commit12 = r["tagName"].removeprefix("dataset-")
              if datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) >= cutoff or commit12 in named:
                  continue
              print("deleting", r["tagName"])
              gh("release", "delete", r["tagName"], "-R", repo, "--cleanup-tag", "--yes")
              deleted += 1
          print(f"{len(datasets)} dataset releases, {deleted} deleted")
